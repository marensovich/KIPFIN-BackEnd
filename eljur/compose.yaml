services:
  app:
    build: .
    container_name: ${APP_NAME}-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${DB_DRIVER}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SHOW_SQL}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${HIBERNATE_DIALECT}
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_ISSUER=${JWT_ISSUER}
      - SPRING_SESSION_STORE_TYPE=${SPRING_SESSION_STORE_TYPE}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
      - UPLOAD_IMAGE_PROFILE_DIRECTORY=${UPLOAD_IMAGE_PROFILE_DIRECTORY}
    env_file:
      - .env
    ports:
      - "${HOST_APP_PORT}:${CONTAINER_APP_PORT}"
    volumes:
      - ./docker/docker-data/app:${UPLOAD_IMAGE_PROFILE_DIRECTORY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTAINER_APP_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mariadb:
    image: mariadb:10.11
    container_name: ${APP_NAME}-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./docker/docker-data/mariadb:/var/lib/mysql
    ports:
      - "${HOST_DB_PORT}:${CONTAINER_DB_PORT}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./docker/docker-data/redis:/data
    ports:
      - "${HOST_REDIS_PORT}:${CONTAINER_REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: ${APP_NAME}-prometheus
    restart: unless-stopped
    ports:
      - "${HOST_PROMETHEUS_PORT}:9090"
    volumes:
      - ./docker/docker-data/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: ${APP_NAME}-cadvisor
    restart: unless-stopped
    ports:
      - "${HOST_CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg

  loki:
    image: grafana/loki
    container_name: ${APP_NAME}-loki
    restart: unless-stopped
    ports:
      - "${HOST_LOKI_PORT}:3100"
    volumes:
      - ./docker/docker-data/loki:/etc/loki
      - ./docker/docker-data/loki/loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yaml'
      - '-config.expand-env=true'
      - '-validation.allow-structured-metadata=false'

  promtail:
    image: grafana/promtail
    container_name: ${APP_NAME}-promtail
    restart: unless-stopped
    volumes:
      - ./docker/docker-data/promtail:/etc/promtail
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - '-config.file=/etc/promtail/promtail-config.yaml'
      - '-config.expand-env=true'
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.3  # Явно указываем стабильную версию
    container_name: ${APP_NAME}-grafana
    user: "472:472"  # Используем правильный UID
    restart: unless-stopped
    ports:
      - "${HOST_GRAFANA_PORT}:3000"
    volumes:
      - ./docker/docker-data/grafana:/var/lib/grafana
      - ./docker/docker-data/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-docker-datasource  # Разрешаем unsigned плагин
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=  # Оставляем пустым, используем provisioning
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  mariadb_data:
  redis_data:
  app_data: