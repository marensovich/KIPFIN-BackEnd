plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.marensovich'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Ваши зависимости остаются без изменений
	implementation 'org.telegram:telegrambots:6.9.7.1'
	implementation 'org.json:json:20250107'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.31.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.session:spring-session-jdbc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	// https://mvnrepository.com/artifact/io.github.cdimascio/dotenv-java
	implementation("io.github.cdimascio:dotenv-java:3.2.0")

}

tasks.javadoc {
	source = sourceSets.main.allJava
	options.encoding = 'UTF-8'
	options.addBooleanOption('html5', true)
	options.author = true
	options.version = true
	options.links("https://docs.oracle.com/en/java/javase/17/docs/api/") // ссылки на стандартную JavaDocs
	options.addStringOption('Xdoclint:none', '-quiet') // отключить предупреждения
}

tasks.named('jar') {
	enabled = false
}

test {
	enabled = false
}
