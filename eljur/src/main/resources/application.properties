# Application
spring.application.name=${SPRING_APPLICATION_NAME}

# Docker
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED}
spring.docker.compose.file=${SPRING_DOCKER_COMPOSE_FILE}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# Session & Redis
server.servlet.session.timeout=3600
spring.session.store-type=${SPRING_SESSION_STORE_TYPE}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# File Storage
uploadImageProfile.directory=${UPLOAD_IMAGE_PROFILE_DIRECTORY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}