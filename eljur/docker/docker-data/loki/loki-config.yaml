auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb  # Изменено с boltdb-shipper на tsdb
      object_store: filesystem
      schema: v13  # Обновлено с v11 до v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}
  allow_structured_metadata: false  # Добавлено для отключения Structured Metadata